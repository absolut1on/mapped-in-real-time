<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor — Mapped in Real Time</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <h1>Mapped in Real Time</h1>
      <span class="role-badge editor">editor</span>
    </div>
    <div class="header-right">
      <div id="editor-controls" style="display:flex">
        <button id="btn-add-pin" class="btn-primary" onclick="toggleAddPinMode()">Add Pin</button>
      </div>
      <span id="user-email"></span>
      <button class="btn-secondary btn-sm" onclick="signOut()">Sign out</button>
    </div>
  </header>

  <div id="map"></div>

  <!-- Add/Edit pin dialog -->
  <div id="pin-dialog" class="dialog-overlay">
    <div class="dialog">
      <h2 id="dialog-title">Add Pin</h2>
      <input type="hidden" id="pin-id">
      <input type="hidden" id="pin-lat">
      <input type="hidden" id="pin-lng">

      <label for="pin-label">Label *</label>
      <input type="text" id="pin-label" placeholder="Pin name" maxlength="100">

      <label for="pin-description">Description</label>
      <textarea id="pin-description" placeholder="Optional details..." maxlength="500"></textarea>

      <label for="pin-icon">Icon (emoji)</label>
      <input type="text" id="pin-icon" value="📍" maxlength="4">

      <div class="dialog-actions">
        <button class="btn-secondary" onclick="closePinDialog()">Cancel</button>
        <button class="btn-primary" onclick="savePinFromDialog()">Save</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/editor.js"></script>
</body>
</html>
